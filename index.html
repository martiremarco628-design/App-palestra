<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Palestra</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 16px 16px 100px; }
    h1 { text-align: center; }
    form {
      background: white; padding: 12px; border-radius: 8px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
    }
    input, select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .largo { grid-column: 1 / -1; }
    button { padding: 12px; font-size: 16px; border: none; border-radius: 6px; background: #2e7d32; color: white; cursor: pointer; }
    h2 { background: #333; color: white; padding: 8px 12px; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #e0e0e0; }
    .azioni { white-space: nowrap; }
    .azioni button { padding: 6px 9px; font-size: 14px; margin: 1px; }
    .timer { background: #1565c0; }
    .modifica { background: #f9a825; }
    .elimina { background: #c62828; }

    .cronometro {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #222; color: white; padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    #display { font-size: 32px; font-weight: bold; font-family: monospace; }
    #etichetta { flex: 1; font-size: 14px; }
    .cronometro button { padding: 10px 14px; }
    #azzera { background: #555; }
        /* Adattamento schermi piccoli */
    * { box-sizing: border-box; }
    input, select { width: 100%; min-width: 0; }

    @media (max-width: 600px) {
      body { padding: 10px 10px 100px; }
      th, td { padding: 6px 3px; font-size: 13px; word-break: break-word; }
      .azioni { white-space: normal; }
      .azioni button { display: block; width: 100%; margin: 3px 0; padding: 6px 4px; }
      #display { font-size: 26px; }
      .cronometro { gap: 6px; padding: 10px; }
      .cronometro button { padding: 10px; }
    }
  </style>
</head>
<body>

  <h1>La mia scheda</h1>

  <form id="modulo">
    <select id="gruppo" class="largo">
      <option>Petto</option>
      <option>Dorso</option>
      <option>Spalle</option>
      <option>Bicipiti</option>
      <option>Tricipiti</option>
      <option>Gambe</option>
      <option>Addome</option>
    </select>
    <input id="esercizio" class="largo" placeholder="Nome esercizio" required>
    <input id="serie" type="number" placeholder="Serie" required>
    <input id="ripetizioni" placeholder="Ripetizioni" required>
    <input id="recupero" type="number" placeholder="Recupero (secondi)">
    <input id="carico" type="number" step="0.5" placeholder="Carico (kg)">
    <button type="submit" id="pulsante" class="largo">Aggiungi esercizio</button>
  </form>

  <div id="scheda"></div>

  <div class="cronometro">
    <span id="display">00:00</span>
    <span id="etichetta">Cronometro</span>
    <button id="avvia" onclick="avviaPausa()">Avvia</button>
    <button id="azzera" onclick="azzera()">Azzera</button>
  </div>

  <script>
    // ===== DATI =====
    let esercizi = JSON.parse(localStorage.getItem("esercizi")) || [];
    let indiceModifica = null;

    function salva() {
      localStorage.setItem("esercizi", JSON.stringify(esercizi));
    }

    function mostra() {
      const scheda = document.getElementById("scheda");
      scheda.innerHTML = "";
      const gruppi = [...new Set(esercizi.map(e => e.gruppo))];

      gruppi.forEach(g => {
        let html = "<h2>" + g + "</h2><table><tr><th>Esercizio</th><th>Serie</th><th>Rip.</th><th>Recupero (s)</th><th>Carico (kg)</th><th></th></tr>";
        esercizi.forEach((e, i) => {
          if (e.gruppo === g) {
            html += `<tr>
              <td>${e.nome}</td><td>${e.serie}</td><td>${e.ripetizioni}</td>
              <td>${e.recupero}</td><td>${e.carico}</td>
              <td class="azioni">
                <button class="timer" onclick="avviaRecupero(${i})">⏱</button>
                <button class="modifica" onclick="modifica(${i})">✏️</button>
                <button class="elimina" onclick="elimina(${i})">X</button>
              </td>
            </tr>`;
          }
        });
        html += "</table>";
        scheda.innerHTML += html;
      });
    }

    function modifica(i) {
      const e = esercizi[i];
      document.getElementById("gruppo").value = e.gruppo;
      document.getElementById("esercizio").value = e.nome;
      document.getElementById("serie").value = e.serie;
      document.getElementById("ripetizioni").value = e.ripetizioni;
      document.getElementById("recupero").value = parseInt(e.recupero) || "";
      document.getElementById("carico").value = parseFloat(e.carico) || "";
      indiceModifica = i;
      document.getElementById("pulsante").textContent = "Salva modifiche";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function elimina(i) {
      if (!confirm("Vuoi eliminare questo esercizio?")) return;
      esercizi.splice(i, 1);
      indiceModifica = null;
      document.getElementById("pulsante").textContent = "Aggiungi esercizio";
      salva();
      mostra();
    }

    document.getElementById("modulo").addEventListener("submit", function (ev) {
      ev.preventDefault();
      const gruppo = document.getElementById("gruppo").value;
      const dati = {
        gruppo: gruppo,
        nome: document.getElementById("esercizio").value,
        serie: document.getElementById("serie").value,
        ripetizioni: document.getElementById("ripetizioni").value,
        recupero: document.getElementById("recupero").value,
        carico: document.getElementById("carico").value
      };
      if (indiceModifica === null) {
        esercizi.push(dati);
      } else {
        esercizi[indiceModifica] = dati;
        indiceModifica = null;
        document.getElementById("pulsante").textContent = "Aggiungi esercizio";
      }
      salva();
      mostra();
      this.reset();
      document.getElementById("gruppo").value = gruppo;
    });

    // ===== CRONOMETRO =====
    let secondi = 0;
    let modo = "su";          // "su" = cronometro libero, "giu" = conto alla rovescia
    let intervallo = null;
    let audio = null;

    function aggiornaDisplay() {
      const m = Math.floor(secondi / 60);
      const s = secondi % 60;
      document.getElementById("display").textContent =
        String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function avvia() {
      if (intervallo) return;
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      intervallo = setInterval(tick, 1000);
      document.getElementById("avvia").textContent = "Pausa";
    }

    function ferma() {
      clearInterval(intervallo);
      intervallo = null;
      document.getElementById("avvia").textContent = "Avvia";
    }

    function avviaPausa() {
      intervallo ? ferma() : avvia();
    }

    function azzera() {
      ferma();
      secondi = 0;
      modo = "su";
      document.getElementById("etichetta").textContent = "Cronometro";
      aggiornaDisplay();
    }

    function avviaRecupero(i) {
      ferma();
      secondi = parseInt(esercizi[i].recupero) || 60;
      modo = "giu";
      document.getElementById("etichetta").textContent = "Recupero: " + esercizi[i].nome;
      aggiornaDisplay();
      avvia();
    }

    function tick() {
      if (modo === "giu") {
        secondi--;
        if (secondi <= 0) {
          secondi = 0;
          ferma();
          segnale();
        }
      } else {
        secondi++;
      }
      aggiornaDisplay();
    }

    function segnale() {
      document.getElementById("etichetta").textContent = "Recupero finito! 💪";
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      if (audio) {
        [0, 0.5, 1].forEach(t => {
          const o = audio.createOscillator();
          const g = audio.createGain();
          o.frequency.value = 880;
          o.connect(g);
          g.connect(audio.destination);
          o.start(audio.currentTime + t);
          o.stop(audio.currentTime + t + 0.3);
        });
      }
    }

    mostra();
    aggiornaDisplay();
  </script>

</body>
</html>
